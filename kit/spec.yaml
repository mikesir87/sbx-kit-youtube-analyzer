      name: analyze-yt-comments
      description: Analyze the YouTube comments on a video (typically about a Docker product) to surface what users liked / what stood out, potential product & blog ideas, and pain points. Use when the user provides a YouTube URL and asks to analyze, summarize, or mine its comments for feedback or product insights.
